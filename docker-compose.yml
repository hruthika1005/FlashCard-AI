version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: flashcard-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: flashcard-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-flashcard-generator
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    volumes:
      - ./backend/src/config/google-vision-key.json:/app/src/config/google-vision-key.json:ro

  frontend:
    build: ./frontend
    container_name: flashcard-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
